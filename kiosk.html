<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TERMINAL://DASHBOARD</title>
<style>
  /* ============================================================
     CONFIG-DRIVEN KIOSK DASHBOARD
     Add new widgets in the WIDGETS array near the bottom of the
     <script> block. Each widget is self-contained: its own fetch,
     its own render, its own refresh timer.
     ============================================================ */

  :root{
    --bg:            #0a0806;
    --bg-panel:      #14100a;
    --bg-panel-2:    #1b150d;
    --border:        #3d2f14;
    --border-bright: #6b4f18;
    --amber:         #ffb000;
    --amber-bright:  #ffd166;
    --amber-dim:     #9c6d00;
    --text:          #e8dcc4;
    --text-dim:      #8a7c60;
    --red:           #ff4433;
    --font: ui-monospace, "Cascadia Code", "JetBrains Mono", "Segoe UI Mono",
            Consolas, "Liberation Mono", Menlo, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  body{
    display:flex; flex-direction:column;
    padding: 18px 22px 14px;
    position: relative;
  }

  /* subtle CRT scanline + vignette overlay, purely atmospheric */
  .crt-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.16) 0px,
        rgba(0,0,0,0.16) 1px,
        transparent 1px,
        transparent 3px
      );
    mix-blend-mode: multiply;
    opacity: 0.35;
  }
  .crt-overlay::after{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 140px rgba(0,0,0,0.75);
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px; margin-bottom: 18px;
    flex-shrink:0;
  }
  .brand{
    font-size: 15px; letter-spacing: 2px; color: var(--amber-dim);
    text-transform: uppercase;
  }
  .brand .city{ color: var(--amber-bright); text-shadow: 0 0 8px rgba(255,209,102,0.5); }

  .clock-wrap{ text-align:right; }
  .clock{
    font-size: 34px; font-weight: 600; letter-spacing: 2px;
    color: var(--amber-bright);
    text-shadow: 0 0 10px rgba(255,176,0,0.45);
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .date{
    font-size: 12px; letter-spacing: 3px; color: var(--text-dim);
    text-transform: uppercase; margin-top: 2px;
  }

  /* ---------- widget grid ---------- */
  .grid{
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    grid-auto-rows: minmax(180px, auto);
    gap: 16px;
    align-content:start;
    overflow: hidden;
  }

  .card{
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--border);
    border-radius: 3px;
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }
  .card[data-span="2"]{ grid-column: span 2; }
  .card[data-span="3"]{ grid-column: span 3; }

  .card-titlebar{
    display:flex; align-items:center; gap:8px;
    padding: 8px 14px;
    background: rgba(255,176,0,0.05);
    border-bottom: 1px solid var(--border);
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--amber-dim);
  }
  .card-titlebar .prompt{ color: var(--amber); }
  .card-titlebar .title{ color: var(--amber-bright); flex-shrink:0; }
  .card-titlebar .spacer{ flex:1; }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-dim);
    box-shadow: 0 0 6px currentColor;
    flex-shrink:0;
  }
  .status-dot.online{ background: var(--amber-bright); color: var(--amber-bright); }
  .status-dot.stale{ background: var(--red); color: var(--red); animation: blink 1.4s steps(1) infinite; }
  .updated{ font-size: 10px; color: var(--text-dim); white-space:nowrap; }

  .card-body{
    flex:1; padding: 16px 18px;
    display:flex; flex-direction:column; justify-content:center;
    overflow:hidden;
  }

  /* ---------- weather widget internals ---------- */
  .wx-main{ display:flex; align-items:center; gap:22px; }
  .wx-temp{
    font-size: 68px; font-weight: 700; color: var(--amber-bright);
    text-shadow: 0 0 14px rgba(255,176,0,0.4);
    line-height:1;
  }
  .wx-temp sup{ font-size: 26px; color: var(--amber-dim); }
  .wx-info{ display:flex; flex-direction:column; gap:4px; }
  .wx-cond{ font-size: 16px; letter-spacing:1px; text-transform:uppercase; color: var(--text); }
  .wx-sub{ font-size: 12px; color: var(--text-dim); letter-spacing:0.5px; }
  .wx-sub b{ color: var(--amber); font-weight:600; }

  .wx-hourly{
    display:flex; gap:14px; margin-top:22px; padding-top:16px;
    border-top: 1px dashed var(--border);
  }
  .wx-hour{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .wx-hour .h-label{ font-size:10px; color: var(--text-dim); letter-spacing:1px; }
  .wx-hour .h-bar-track{
    width:10px; height:60px; background: rgba(255,176,0,0.08);
    border:1px solid var(--border); border-radius:2px;
    display:flex; align-items:flex-end; overflow:hidden;
  }
  .wx-hour .h-bar{ width:100%; background: linear-gradient(180deg, var(--amber-bright), var(--amber-dim)); }
  .wx-hour .h-temp{ font-size:11px; color: var(--amber); font-weight:600; }

  .placeholder{ color: var(--text-dim); font-size: 13px; letter-spacing:1px; }
  .placeholder.err{ color: var(--red); }

  /* ---------- status bar ---------- */
  .statusbar{
    flex-shrink:0; margin-top: 14px; padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase;
    display:flex; justify-content:space-between;
  }
</style>
</head>
<body>

  <div class="crt-overlay"></div>

  <header class="topbar">
    <div>
      <div class="brand">TERMINAL://<span class="city" id="brand-city">DASHBOARD</span></div>
    </div>
    <div class="clock-wrap">
      <div class="clock"><span id="clock-time">00:00:00</span></div>
      <div class="date" id="clock-date">MON JAN 01</div>
    </div>
  </header>

  <main class="grid" id="widget-grid"></main>

  <footer class="statusbar">
    <span id="status-left">SYS OK</span>
    <span id="status-right">REFRESH 45s</span>
  </footer>

<script>
(function(){
  "use strict";

  /* ============================================================
     1. CONFIG — edit this block to point at your own location
     ============================================================ */
  const CONFIG = {
    city: "Toronto",
    latitude: 43.6532,
    longitude: -79.3832,
    timezone: "America/Toronto",
    refreshMs: 45000,      // default refresh for widgets that don't override
    clockTickMs: 1000
  };

  document.getElementById("brand-city").textContent = CONFIG.city.toUpperCase();
  document.getElementById("status-right").textContent =
    "REFRESH " + Math.round(CONFIG.refreshMs / 1000) + "s";

  /* ============================================================
     2. CLOCK
     ============================================================ */
  function updateClock(){
    const now = new Date();
    const opts = { timeZone: CONFIG.timezone, hour12:false,
                    hour:"2-digit", minute:"2-digit", second:"2-digit" };
    document.getElementById("clock-time").textContent =
      new Intl.DateTimeFormat("en-GB", opts).format(now);

    const dopts = { timeZone: CONFIG.timezone, weekday:"short",
                     month:"short", day:"2-digit" };
    document.getElementById("clock-date").textContent =
      new Intl.DateTimeFormat("en-US", dopts).format(now).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, CONFIG.clockTickMs);

  /* ============================================================
     3. WMO WEATHER CODE -> LABEL
     ============================================================ */
  const WMO = {
    0:"CLEAR SKY", 1:"MOSTLY CLEAR", 2:"PARTLY CLOUDY", 3:"OVERCAST",
    45:"FOG", 48:"ICE FOG",
    51:"LIGHT DRIZZLE", 53:"DRIZZLE", 55:"DENSE DRIZZLE",
    56:"FREEZING DRIZZLE", 57:"FREEZING DRIZZLE",
    61:"LIGHT RAIN", 63:"RAIN", 65:"HEAVY RAIN",
    66:"FREEZING RAIN", 67:"FREEZING RAIN",
    71:"LIGHT SNOW", 73:"SNOW", 75:"HEAVY SNOW", 77:"SNOW GRAINS",
    80:"RAIN SHOWERS", 81:"RAIN SHOWERS", 82:"VIOLENT SHOWERS",
    85:"SNOW SHOWERS", 86:"SNOW SHOWERS",
    95:"THUNDERSTORM", 96:"THUNDERSTORM + HAIL", 99:"THUNDERSTORM + HAIL"
  };
  const wmoLabel = c => WMO[c] || "UNKNOWN";

  /* ============================================================
     4. WIDGET ENGINE
     Each widget: { id, title, span, refreshMs, fetch(), render(el,data) }
     ============================================================ */
  const cache = {};

  function diagnoseError(err){
    const msg = (err && err.message) ? err.message : String(err);
    if (!navigator.onLine){
      return "DEVICE OFFLINE — CHECK WIFI/ETHERNET";
    }
    // system clock badly wrong (common on fresh Pi Lite installs w/ no RTC,
    // before NTP has synced) breaks TLS cert validation -> generic "Failed to fetch"
    if (new Date().getFullYear() < 2024){
      return "SYSTEM CLOCK WRONG (" + new Date().getFullYear() + ") — NTP NOT SYNCED YET";
    }
    if (/Failed to fetch|NetworkError|TypeError/i.test(msg)){
      return "NETWORK/DNS ERROR — CHECK CONNECTIVITY OR CLOCK";
    }
    if (/HTTP\s*[45]\d\d/.test(msg)){
      return "API ERROR — " + msg;
    }
    return msg.toUpperCase();
  }

  function buildCardDOM(widget){
    const card = document.createElement("section");
    card.className = "card";
    card.dataset.widget = widget.id;
    if (widget.span) card.dataset.span = widget.span;

    card.innerHTML = `
      <div class="card-titlebar">
        <span class="prompt">&gt;</span>
        <span class="title">${widget.title}</span>
        <span class="spacer"></span>
        <span class="updated" data-updated>--:--:--</span>
        <span class="status-dot" data-status></span>
      </div>
      <div class="card-body" data-body>
        <span class="placeholder">LOADING&hellip;</span>
      </div>
    `;
    document.getElementById("widget-grid").appendChild(card);
    return {
      body: card.querySelector("[data-body]"),
      status: card.querySelector("[data-status]"),
      updated: card.querySelector("[data-updated]")
    };
  }

  function setStatus(refs, state){
    refs.status.className = "status-dot" + (state === "online" ? " online" : state === "stale" ? " stale" : "");
  }

  function stampUpdated(refs){
    const now = new Date();
    const opts = { timeZone: CONFIG.timezone, hour12:false,
                    hour:"2-digit", minute:"2-digit", second:"2-digit" };
    refs.updated.textContent = new Intl.DateTimeFormat("en-GB", opts).format(now);
  }

  async function tick(widget, refs){
    try{
      const data = await widget.fetch();
      cache[widget.id] = data;
      widget.render(refs.body, data);
      setStatus(refs, "online");
      stampUpdated(refs);
    }catch(err){
      console.error("[" + widget.id + "]", err);
      const reason = diagnoseError(err);
      document.getElementById("status-left").textContent = "ERR: " + widget.id.toUpperCase() + " — " + reason;
      if (cache[widget.id]){
        widget.render(refs.body, cache[widget.id]);
      } else {
        refs.body.innerHTML =
          '<span class="placeholder err">FETCH FAILED</span>' +
          '<span class="placeholder err" style="font-size:11px;margin-top:6px;">' + reason + '</span>';
      }
      setStatus(refs, "stale");
    }finally{
      setTimeout(() => tick(widget, refs), widget.refreshMs || CONFIG.refreshMs);
    }
  }

  function mount(widgets){
    widgets.forEach(widget => {
      const refs = buildCardDOM(widget);
      tick(widget, refs);
    });
  }

  /* ============================================================
     5. WIDGETS
     ============================================================ */
  const WIDGETS = [
    {
      id: "weather",
      title: "WEATHER",
      span: 2,
      refreshMs: CONFIG.refreshMs,

      async fetch(){
        const url = "https://api.open-meteo.com/v1/forecast"
          + "?latitude=" + CONFIG.latitude
          + "&longitude=" + CONFIG.longitude
          + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code"
          + "&hourly=temperature_2m,weather_code"
          + "&timezone=" + encodeURIComponent(CONFIG.timezone)
          + "&forecast_days=1";
        const res = await fetch(url);
        if (!res.ok) throw new Error("open-meteo HTTP " + res.status);
        return res.json();
      },

      render(el, data){
        const cur = data.current;
        const hourly = data.hourly;

        // find next 5 hours starting from current hour
        const nowIso = cur.time;
        let startIdx = hourly.time.indexOf(nowIso);
        if (startIdx === -1) startIdx = 0;
        const hrs = [];
        for (let i = startIdx; i < Math.min(startIdx + 5, hourly.time.length); i++){
          hrs.push({ time: hourly.time[i], temp: hourly.temperature_2m[i], code: hourly.weather_code[i] });
        }
        const temps = hrs.map(h => h.temp);
        const minT = Math.min(...temps, cur.temperature_2m);
        const maxT = Math.max(...temps, cur.temperature_2m);
        const range = Math.max(maxT - minT, 1);

        const hourlyHTML = hrs.map(h => {
          const hourLabel = new Date(h.time).toLocaleTimeString("en-US", {
            hour:"numeric", hour12:true, timeZone: CONFIG.timezone
          }).replace(" ", "").toUpperCase();
          const pct = Math.round(((h.temp - minT) / range) * 80) + 15; // 15-95%
          return `
            <div class="wx-hour">
              <span class="h-temp">${Math.round(h.temp)}°</span>
              <div class="h-bar-track"><div class="h-bar" style="height:${pct}%"></div></div>
              <span class="h-label">${hourLabel}</span>
            </div>`;
        }).join("");

        el.innerHTML = `
          <div class="wx-main">
            <div class="wx-temp">${Math.round(cur.temperature_2m)}<sup>°C</sup></div>
            <div class="wx-info">
              <div class="wx-cond">${wmoLabel(cur.weather_code)}</div>
              <div class="wx-sub">FEELS LIKE <b>${Math.round(cur.apparent_temperature)}°C</b></div>
              <div class="wx-sub">HUMIDITY <b>${Math.round(cur.relative_humidity_2m)}%</b> &nbsp;WIND <b>${Math.round(cur.wind_speed_10m)} KM/H</b></div>
            </div>
          </div>
          <div class="wx-hourly">${hourlyHTML}</div>
        `;
      }
    }

    // Add more widgets here, e.g.:
    // {
    //   id: "transit",
    //   title: "BUS — ROUTE 512",
    //   span: 1,
    //   refreshMs: 30000,
    //   async fetch(){ /* call your transit API, return parsed data */ },
    //   render(el, data){ /* build el.innerHTML from data */ }
    // }
  ];

  mount(WIDGETS);
})();
</script>
</body>
</html>
