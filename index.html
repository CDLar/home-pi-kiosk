<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TERMINAL://DASHBOARD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="crt-overlay"></div>

  <header class="topbar">
    <div>
      <div class="brand">TERMINAL://<span class="city" id="brand-city">DASHBOARD</span></div>
    </div>
    <div class="clock-wrap">
      <div class="clock"><span id="clock-time">00:00:00</span></div>
      <div class="date" id="clock-date">MON JAN 01</div>
    </div>
  </header>

  <main class="grid" id="widget-grid"></main>

  <footer class="statusbar">
    <span id="status-left">SYS OK</span>
    <span id="status-right">REFRESH 45s</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/widget-engine.js"></script>
  <script src="js/widgets/weather.js"></script>
  <script src="js/widgets/air-quality.js"></script>
  <script src="js/widgets/transit.js"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
